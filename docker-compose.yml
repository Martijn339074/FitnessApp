services:
  db:
    image: postgres:16
    container_name: fitnessapp-db
    environment:
      POSTGRES_DB: fitnessapp
      POSTGRES_USER: fitnessuser
      POSTGRES_PASSWORD: fitnesspass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data: